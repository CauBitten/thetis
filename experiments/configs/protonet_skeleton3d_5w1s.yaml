# ProtoNet · skeleton3d · 5-way 1-shot (meta_val/meta_test rodam 3-way; split 6/3/3).
# Vídeo de VISUALIZAÇÃO do esqueleto 3D, não coordenadas de junta (cobertura ~61%: 93-110 clipes/classe).
# Documentação de todas as chaves: experiments/configs/README.md
method: protonet
run_id: protonet_skeleton3d_5w1s

modalities:
  - skeleton_3d

encoder:
  name: r2plus1d_18
  pretrained: true
  batch_size: 16
  gradient_checkpointing: true

episode:
  n_way: 5
  n_way_val: 3
  n_way_test: 3
  k_shot: 1
  q_query: 15
  episodes_per_epoch: 200
  episodes_meta_val: 100
  episodes_meta_test: 1000

optim:
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0
  eval_every: 5
  fp16: true
  stream_query: true

data:
  manifest_path: data/processed/manifest.csv
  dataset_root: dataset
  train_classes: 6
  val_classes: 3
  test_classes: 3
  frame_count: 16
  resize_size: 128
  spatial_size: 112
  cache_decoded: true
  exclude_defective: true      # pula clipes em branco e duplicatas byte a byte do THETIS

seed: 42
