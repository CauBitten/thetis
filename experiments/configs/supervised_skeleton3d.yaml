# Supervisionado (Baseline de Chen et al. 2019) · skeleton3d · treino convencional, sem episódios e sem K (split de classes 6/3/3).
# Vídeo de VISUALIZAÇÃO do esqueleto 3D, não coordenadas de junta (cobertura ~61%: 93-110 clipes/classe).
# Documentação de todas as chaves: experiments/configs/README.md
method: supervised
run_id: supervised_skeleton3d

modalities:
  - skeleton_3d

encoder:
  name: r2plus1d_18
  pretrained: true
  batch_size: 16
  gradient_checkpointing: true

model:                         # treino sem episódios; no teste, classificador linear novo por episódio
  train_classes: [backhand, backhand_volley, forehand_openstands, forehand_slice, kick_service, smash]  # meta_train do split 6/3/3, seed 42 (o trainer confere)
  finetune_epochs: 100          # ajuste no suporte, valores de Chen et al.
  finetune_batch_size: 4
  finetune_lr: 0.01

episode:                       # só validação e teste, iguais aos dos métodos few-shot (classes novas)
  n_way: 3                     # 3-way em val/test (as 3 classes de meta_val / meta_test)
  k_shot: 5                    # K dos episódios de validação que escolhem o best.pt; o teste roda K=1 e K=5 (eval --k-shot)
  q_query: 15
  episodes_meta_val: 100
  episodes_meta_test: 1000

optim:
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0
  eval_every: 5
  fp16: true

data:
  manifest_path: data/processed/manifest.csv
  dataset_root: dataset
  train_classes: 6
  val_classes: 3
  test_classes: 3
  frame_count: 16
  resize_size: 128
  spatial_size: 112
  cache_decoded: true
  exclude_defective: true      # pula clipes em branco e duplicatas byte a byte do THETIS

seed: 42
