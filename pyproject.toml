[project]
name = "thetis"
version = "0.1.0"
description = "Research and implementation of spatio-temporal algorithms for tennis action recognition using the Thetis dataset"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "matplotlib>=3.8",
    "pandas>=2.2",
    "numpy>=1.26",
    "opencv-python>=4.8",
    "torch>=2.2",
    "torchvision>=0.17",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "open-clip-torch>=2.24",
]

[project.optional-dependencies]
fast = ["decord>=0.6; sys_platform == 'linux'"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.4",
    "pillow>=12.2.0",
    "pytest>=8",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]
